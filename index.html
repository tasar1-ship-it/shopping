// Precompute match plan once: phrases + longer non-ASCII words first (longest first),
// then single ASCII words in category priority order.
var _P1=[],_P2=[];
(function(){
  for(var i=0;i<KR.length;i++){
    var kws=KR[i][1];
    for(var j=0;j<kws.length;j++){
      var kw=kws[j];
      var nonAscii=/[^\x00-\x7F]/.test(kw);
      if(kw.indexOf(' ')>-1||(nonAscii&&kw.length>=3)){_P1.push([kw,KR[i][0],nonAscii]);}
      else{_P2.push([kw,KR[i][0],nonAscii]);}
    }
  }
  _P1.sort(function(a,b){return b[0].length-a[0].length;});
})();
function _norm(t){
  return String(t).toLowerCase().replace(/[\u2019'`\u00B4]/g,"'").replace(/[.,;:!?()\[\]"]/g,' ').replace(/\s+/g,' ').trim();
}
function _hit(lower,e){
  var kw=e[0];
  if(e[2])return lower.indexOf(kw)>=0;
  if(!e[3]){
    var escaped=kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    // word boundary that also tolerates simple plurals: apple / apples / tomatoes
    e[3]=new RegExp('(^|[^a-z0-9])'+escaped+'(s|es)?($|[^a-z0-9])'); // built once per keyword, then reused
  }
  return e[3].test(lower);
}
// Whole-entry exceptions (a plural that would otherwise match an earlier section)
var _EX={'mints':'Sweets & Desserts','crema':'Personal Care','spread':'Chilled & Dairy','pur\u00E9':'Ready-Made & Convenience'};
function classify(text){
  var lower=_norm(text);
  if(!lower)return "Other";
  if(_EX.hasOwnProperty(lower))return _EX[lower];
  // "frozen ..." and "canned/tinned ..." decide the section whatever the food is
  // (pet food stays with Pet; "Eis" is German for ice cream and would otherwise match "Ei", egg)
  if(!/(^| )(dog|cat|pet|puppy|kitten)( |$)/.test(lower)){
    if(/(^| )(frozen|congelad[oa]s?|eis)( |$)/.test(lower))return "Frozen Foods";
    if(/(^| )(canned|tinned)( |$)/.test(lower))return "Canned & Preserved Goods";
  }
  for(var i=0;i<_P1.length;i++){if(_hit(lower,_P1[i]))return _P1[i][1];}
  for(var j=0;j<_P2.length;j++){if(_hit(lower,_P2[j]))return _P2[j][1];}
  return "Other";
}

// ─── SAVE: localStorage + Firebase ───
function sv(){
  // Strip photos for cloud save (too large)
  var sClean=shop.map(function(x){var c={};for(var k in x)c[k]=x[k];c.photo=null;return c});
  // Local (with photos)
  try{
    localStorage.setItem('sl3_s',JSON.stringify(shop));
    localStorage.setItem('sl3_l',lang);
  }catch(e){
    // Storage full (photos): keep the list itself, drop the photos
    try{
      localStorage.setItem('sl3_s',JSON.stringify(sClean));
      localStorage.setItem('sl3_l',lang);
    }catch(e2){}
  }
  // Firebase (without photos)
  if(fbUp){try{

    db.ref('devices/'+devId+'/lang').set(lang);
  }catch(e){}}
}

// ─── LOAD: localStorage first, then Firebase overwrites ───
function ld(){
  // Migrate from old version (sl2_ keys) if no sl3_ data exists
  try{
    var hasNew=localStorage.getItem('sl3_s');
    if(hasNew===null){
      var oldS=JSON.parse(localStorage.getItem('sl2_s'));
      var oldL=localStorage.getItem('sl2_l');
      if(oldS){localStorage.setItem('sl3_s',JSON.stringify(oldS));}
      if(oldL){localStorage.setItem('sl3_l',oldL);}
    }
  }catch(e){}
  // Does this phone already hold a saved list? If so it is the master copy;
  // the cloud copy is only a backup and must never overwrite it (it can be stale
  // when earlier saves were made with no signal).
  var hadLocal=false;
  // Local first (fast, has photos)
  try{
    var b=JSON.parse(localStorage.getItem('sl3_s'));
    if(b&&typeof b.length==='number'){shop=b;hadLocal=true;} // a damaged local copy does not count
    var c=localStorage.getItem('sl3_l');if(c)lang=c;
  }catch(e){}
  // New app version deployed? Clear shopping + completed (template preserved)
  try{
    var pv=localStorage.getItem('sl3_ver');
    if(pv!==APP_V){
      shop=[];
      justCleared=true;
      localStorage.setItem('sl3_ver',APP_V);
      localStorage.setItem('sl3_s',JSON.stringify([]));
    }
  }catch(e){}
  fixUid();
  if(!fbUp){fbOK=false;loadDone=true;if(pendingInbox){pendingInbox=null;}R();return;}
  // Watchdog: if the cloud neither answers nor errors within 5s, go local and deliver any waiting inbox
  setTimeout(function(){if(!loadDone){loadDone=true;fbOK=false;fbErr='cloud timeout';if(pendingInbox){applyInbox(pendingInbox);pendingInbox=null;}R();}},5000);
  // Then load from Firebase (authoritative, no photos)
  try{db.ref('devices/'+devId).once('value',function(snap){
    if(loadDone){fbOK=true;fbErr='';sv();R();return;} // late answer after watchdog: local wins, push it up
    var d=snap.val();
    fbOK=true;fbErr='';
    if(d&&!hadLocal&&!justCleared){
      // Nothing saved on this phone: restore the cloud backup
      if(d.shopping&&d.shopping.length)shop=d.shopping;
      if(d.lang)lang=d.lang;
      fixUid();
    }
    sv(); // this phone's list is the master: bring the cloud backup up to date
    justCleared=false;
    loadDone=true;
    if(pendingInbox){applyInbox(pendingInbox);pendingInbox=null;}
    R();
  },function(err){
    fbOK=false;fbErr=String(err&&err.message||err);
    loadDone=true;
    if(pendingInbox){applyInbox(pendingInbox);pendingInbox=null;}
    R();
  });}catch(e){fbOK=false;fbErr=String(e&&e.message||e);loadDone=true;R();}
}

function fixUid(){
  var mx=0;
  for(var i=0;i<shop.length;i++){if(shop[i].id>mx)mx=shop[i].id;}
  uid=mx;
}

// ─── INBOX: listen for items sent from another device ───
var loadDone=false;
var pendingInbox=null;
var lastInboxTime=0;

function applyInbox(d){
  if(!d)return;
  var items=d.items;
  if(!items||!items.length)return;
  // Dedupe guard: same payload delivered twice (listener + foreground check)
  if(d.time&&d.time===lastInboxTime)return;
  if(d.time)lastInboxTime=d.time;
  var count=0;
  // The sender always sends the whole list: skip items already waiting on this list
  var have={};
  for(var h=0;h<shop.length;h++){if(!shop[h].done)have[String(shop[h].text).toLowerCase().replace(/\s+/g,' ').trim()]=true;}
  for(var i=0;i<items.length;i++){
    var it=items[i];
    if(it.text){
      var key=String(it.text).toLowerCase().replace(/\s+/g,' ').trim();
      if(have[key])continue;
      shop.push({id:nid(),text:it.text,category:it.category||classify(it.text),qty:it.qty||1,photo:null,done:false});
      count++;
    }
  }
  // Clear inbox
  if(fbUp){try{db.ref('inbox/'+devId).remove();}catch(e){}}
  if(count>0){
    tab='shopping';
    sv();R();
    showToast((lang==='ko'?count+'\uAC1C \uD56D\uBAA9 \uC218\uC2E0!':count+' items received!'));
  }else{
    showToast(lang==='ko'?'\uC0C8 \uD56D\uBAA9 \uC5C6\uC74C':'Nothing new received');
  }
}

function listenInbox(){
  if(!fbUp)return;
  db.ref('inbox/'+devId).on('value',function(snap){
    var d=snap.val();
    if(!d)return;
    // Initial device load still in flight? Buffer, or its callback would
    // overwrite the merged list with the older cloud copy (items lost).
    if(!loadDone){pendingInbox=d;return;}
    applyInbox(d);
  });
}

// iPhone Safari suspends the connection in background; re-check on return
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='visible'&&loadDone&&fbUp){
    try{db.ref('inbox/'+devId).once('value',function(s){applyInbox(s.val());});}catch(e){}
  }
});

function sendToR(){
  if(!fbUp||!fbOK){showToast(lang==='ko'?'\uC624\uD504\uB77C\uC778 \u2014 \uC804\uC1A1 \uBD88\uAC00':'Offline \u2014 cannot send');return;}
  var target=getSendTarget();

  var act=[];
  for(var i=0;i<shop.length;i++){
    if(!shop[i].done)act.push({text:shop[i].text,category:shop[i].category,qty:shop[i].qty});

  db.ref('inbox/'+target).set({items:act,from:devId,time:Date.now()},function(err){

function grp(items){
  var g={};
  for(var i=0;i<items.length;i++){var c=items[i].category;if(!g[c])g[c]=[];g[c].push(items[i]);}
  var rank=function(k){return k==='Lukas'?2:k==='Other'?1:0};var keys=Object.keys(g).sort(function(a,b){var ra=rank(a),rb=rank(b);if(ra!==rb)return ra-rb;return a.localeCompare(b)});
  var result=[];for(var i=0;i<keys.length;i++)result.push({c:keys[i],items:g[keys[i]]});return result;
}

function tgLang(){lang=lang==='en'?'ko':'en';sv();R()}
function sTab(t){tab=t;R()}

function addS(){
  var mi=document.getElementById('mi');if(mi)inp=mi.value;
  var txt=inp.trim();if(!txt)return;
  shop.push({id:nid(),text:txt,category:classify(txt),qty:1,photo:photo,done:false});
  inp='';photo=null;var ph=document.getElementById('phIn');if(ph)ph.value='';sv();R();

var ckTm=null;
function finishChk(){
  if(!ckid)return null;
  var item=null;
  for(var i=0;i<shop.length;i++){if(shop[i].id===ckid){shop[i].done=true;item=shop[i];break;}}
  ckid=null;clearTimeout(ckTm);ckTm=null;
  return item;
}
function chkOff(id){
  if(ckid===id)return;
  if(ckid){finishChk();sv();} // an earlier tick is still animating: complete and save it now so this tap is not lost
  ckid=id;R();
  ckTm=setTimeout(function(){
    var item=finishChk();
    sv();R();
    if(item)showUndo(item,'c');
  },350);
}
function clearShop(){
  var removed=[];var keep=[];
  for(var i=0;i<shop.length;i++){if(shop[i].done||shop[i].category==='Lukas')keep.push(shop[i]);else removed.push(shop[i]);}
  if(removed.length===0)return;
  if(!window.confirm(lang==='ko'?'\uD56D\uBAA9 '+removed.length+'\uAC1C\uB97C \uBAA8\uB450 \uC9C0\uC6B8\uAE4C\uC694?':'Clear all '+removed.length+' items?'))return;
  shop=keep;sv();R();
  showUndoBulk(removed);
}
function delAllDone(){
  var n=0;for(var i=0;i<shop.length;i++){if(shop[i].done)n++;}
  if(n===0)return;
  var msg=lang==='ko'?'\uC644\uB8CC \uD56D\uBAA9 '+n+'\uAC1C\uB97C \uBAA8\uB450 \uC0AD\uC81C\uD560\uAE4C\uC694?':'Delete all '+n+' completed items?';
  if(!window.confirm(msg))return;
  shop=shop.filter(function(x){return !x.done});
  sv();R();
  showToast(lang==='ko'?n+'\uAC1C \uD56D\uBAA9 \uC0AD\uC81C\uB428':n+' items deleted');
}
function showUndoBulk(items){
  var old=document.getElementById('undoToast');if(old)old.remove();
  clearTimeout(undoTm);
  var d=document.createElement('div');
  d.className='toast';d.id='undoToast';
  d.style.display='flex';d.style.alignItems='center';d.style.gap='12px';
  var label=document.createElement('span');
  label.textContent=lang==='ko'?items.length+'\uAC1C \uD56D\uBAA9 \uC0AD\uC81C\uB428':'Cleared '+items.length+' items';
  var btn=document.createElement('button');
  btn.textContent=lang==='ko'?'\uC2E4\uD589 \uCDE8\uC18C':'Undo';
  btn.style.cssText='background:#fff;color:#0062CC;border:none;padding:5px 14px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit';
  btn.onclick=function(){
    shop=shop.concat(items);
    sv();R();d.remove();clearTimeout(undoTm);
  };
  d.appendChild(label);d.appendChild(btn);
  document.body.appendChild(d);
  undoTm=setTimeout(function(){d.remove()},3000);
}
function delShop(id){
  var removed=null;
  for(var i=0;i<shop.length;i++){if(shop[i].id===id){removed=shop[i];break;}}
  shop=shop.filter(function(x){return x.id!==id});sv();R();
  if(removed)showUndo(removed,'s');
}
function rstAll(){for(var i=0;i<shop.length;i++)shop[i].done=false;tab='shopping';sv();R()}

// ─── PHOTO ───
function pPh(){
  var mi=document.getElementById('mi');if(mi)inp=mi.value;
  var el=document.getElementById('phIn');
  if(!el){
    el=document.createElement('input');el.type='file';el.accept='image/*';el.capture='environment';el.id='phIn';el.style.display='none';document.body.appendChild(el);
    el.onchange=function(){
      var f=this.files[0];if(!f)return;
      var r=new FileReader();
      r.onload=function(e){
        compressPhoto(e.target.result,function(c){
          photo=c;
          // Name already typed? Add the item with the photo immediately.
          var mi2=document.getElementById('mi');
          var txt=(mi2?mi2.value:inp).trim();
          if(txt){
            addS();
          }else{
            R();
            showToast(lang==='ko'?'\uC0AC\uC9C4 \uC900\uBE44\uB428 \u2014 \uC774\uB984\uC744 \uC785\uB825\uD558\uC138\uC694':'Photo ready \u2014 type a name');
          }
        });
      };
      r.readAsDataURL(f);
    };
  }
  el.click();
}
function compressPhoto(dataURL,cb){
  var img=new Image();
  img.onload=function(){
    var mx=400,w=img.width,h=img.height;
    if(w>mx||h>mx){if(w>h){h=Math.round(h*mx/w);w=mx;}else{w=Math.round(w*mx/h);h=mx;}}
    var c=document.createElement('canvas');c.width=w;c.height=h;
    c.getContext('2d').drawImage(img,0,0,w,h);
    cb(c.toDataURL('image/jpeg',0.6));
  };
  img.onerror=function(){cb(dataURL)};
  img.src=dataURL;
}

function showPhId(id,type,ev){
  if(ev){ev.stopPropagation();ev.preventDefault();}
  var arr=shop;var src=null;
  for(var i=0;i<arr.length;i++){if(arr[i].id===id&&arr[i].photo){src=arr[i].photo;break;}}
  if(!src)return;
  var d=document.createElement('div');d.className='overlay';
  d.ontouchend=function(e){e.preventDefault();document.body.removeChild(d)};
  d.onclick=function(){document.body.removeChild(d)};
  var im=document.createElement('img');im.src=src;d.appendChild(im);document.body.appendChild(d);
}
document.addEventListener('click',function(e){
  var el=e.target;
  if(el.tagName==='IMG'&&el.className==='th'){
    var id=parseInt(el.getAttribute('data-id'));

// ─── VOICE (rebuilt 12 Nov 2026) ───
// iPhone Safari's speech recognizer is unreliable when a second session is opened on a page. Because that
// cannot be reproduced off the phone, there are three ways of driving it, switched by tapping the small
// grey status text in the ID bar (the choice is remembered on that phone):
//   A = one recognizer object, reused for every session; one long session until you mute (default)
//   B = a new recognizer object for every session; one long session until you mute
//   C = one recognizer object; one short session per item
// Every tap and every event the phone reports is written to a short log (no words, only event names,
// word counts and timings) and saved under diag/<device id> in the database, so a failure can be read later.
var BUILD='b5';
var V_GAP_MS=300;     // pause between one session ending and the next one starting
var V_STABLE_MS=800;  // mode C: an item lands this long after the words stop changing
var vMode='A';
try{var _vm=localStorage.getItem('sl3_vmode');if(_vm==='A'||_vm==='B'||_vm==='C')vMode=_vm;}catch(e){}
var vRun=false;       // start() was called and that session has not reported its end
var vSess=null;       // the current session's state
var vFail=0,vLastErr='',vEndedAt=0;
var vLog=[],vLogId=0,vT0=Date.now();
function vlog(s){if(vLog.length<300)vLog.push((Date.now()-vT0)+' '+s);}
function vFlush(){
  if(!fbUp||!vLogId||!vLog.length)return;
  var ua='';try{ua=String(navigator.userAgent||'').slice(0,160);}catch(e){}
  try{db.ref('diag/'+devId+'/'+vLogId).set({build:BUILD,mode:vMode,lang:lang,ua:ua,log:vLog});}catch(e){}
}
function vMsgListen(){return lang==='ko'?'\uB4E3\uACE0 \uC788\uC2B5\uB2C8\uB2E4...':'Listening...';}
function vMsgStart(){return lang==='ko'?'\uB9C8\uC774\uD06C \uC2DC\uC791 \uC911...':'Starting microphone...';}

function tgV(){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){showVM(lang==='ko'?'\uC74C\uC131 \uC785\uB825 \uBD88\uAC00 (HTTPS \uD544\uC694)':'Voice needs HTTPS');return}
  if(listening){vOff();return;}
  listening=true;vFail=0;vLastErr='';
  vLogId=Date.now();vLog=[];vT0=Date.now();vlog('tap on, mode '+vMode+', build '+BUILD);
  vmsg=vMsgStart();R();
  if(vRun){
    // The previous session is still closing: its end opens the new one. If the phone never reports
    // the end, stop waiting after 2 seconds and start with a fresh recognizer.
    var w=vSess;vlog('old session still closing');
    setTimeout(function(){if(listening&&vRun&&vSess===w){vlog('old session never ended');vDrop();vBegin();}},2000);
    setTimeout(vFlush,8000);
    return;
  }
  setTimeout(vFlush,8000); // save the log even if the mic is never muted (a deaf session stays "on")
  var since=Date.now()-vEndedAt;
  if(since<V_GAP_MS){setTimeout(function(){if(listening&&!vRun)vBegin();},V_GAP_MS-since);return;}
  vBegin();
}
function vOff(){
  listening=false;vlog('tap off');
  if(vSess){clearTimeout(vSess.wd);}
  // stop(), not abort(): the phone finishes the words it has already heard
  if(vRun&&recog){try{recog.stop();}catch(ex){}}
  vmsg=null;R();
  setTimeout(vFlush,1500); // after the session's last events have come in
}
function vGiveUp(){
  listening=false;vmsg=null;vlog('gave up: '+vLastErr);
  showVM((lang==='ko'?'\uC74C\uC131 \uC911\uC9C0\uB428':'Voice stopped')+(vLastErr?' ('+vLastErr+')':'')+(lang==='ko'?' \u2014 \uB9C8\uC774\uD06C\uB97C \uB2E4\uC2DC \uB204\uB974\uC138\uC694':' \u2014 tap the mic again'));
  vFlush();
}
function vDrop(){
  // Forget the current recognizer object completely; the next session gets a new one
  var o=recog;recog=null;vRun=false;
  if(o){o.onstart=o.onresult=o.onerror=o.onend=null;try{o.abort();}catch(ex){}}
}
function cycleVMode(){
  if(listening)vOff();
  vMode=vMode==='A'?'B':(vMode==='B'?'C':'A');
  try{localStorage.setItem('sl3_vmode',vMode);}catch(e){}
  vDrop();
  R();showToast((lang==='ko'?'\uC74C\uC131 \uBAA8\uB4DC ':'Voice mode ')+vMode);
}
function vMake(){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  var r=new SR();
  r.interimResults=true;r.maxAlternatives=1;
  function note(name){r['on'+name]=function(){if(r!==recog)return;if(vSess)vSess.started=true;vlog(name);};}
  note('audiostart');note('soundstart');note('speechstart');note('speechend');note('soundend');note('audioend');note('nomatch');
  r.onstart=function(){
    if(r!==recog)return;
    vlog('start');if(vSess)vSess.started=true;
    if(listening){vmsg=aiArmed?(lang==='ko'?'\uC5B4\uB5A4 \uBB3C\uAC74\uC778\uC9C0 \uC124\uBA85\uD574 \uC8FC\uC138\uC694...':'Describe the item...'):vMsgListen();R();}
  };
  r.onresult=function(e){
    if(r!==recog||!vSess)return;
    vSess.started=true;vSess.got=true;vFail=0;
    var last=e.results[e.results.length-1];
    vlog('result '+(last&&last.isFinal?'final':'draft')+' n'+e.results.length);
    vSess.res(e);
  };
  r.onerror=function(e){
    if(r!==recog)return;
    vLastErr=(e&&e.error)||'';vlog('error '+vLastErr);
    if(vLastErr==='not-allowed'||vLastErr==='service-not-allowed'){
      listening=false;if(vSess)vSess.denied=true;
      showVM(lang==='ko'?'\uB9C8\uC774\uD06C \uAD8C\uD55C \uD544\uC694':'Mic access needed');
      return;
    }
    if(vLastErr!=='no-speech'&&vLastErr!=='aborted'){showVM('Voice: '+vLastErr);}
  };
  r.onend=function(){
    if(r!==recog)return;
    vlog('end');vRun=false;vEndedAt=Date.now();
    var s=vSess;
    if(s){clearTimeout(s.wd);s.flush();} // words heard but not yet turned into an item are kept
    var mi=document.getElementById('mi');if(mi&&!inp)mi.value='';
    if(!listening){
      if(!(s&&s.denied)){vmsg=null;R();} // keep the "Mic access needed" message on screen
      vFlush();return;
    }
    // A session that dies at once without hearing anything, several times in a row, means the mic is
    // not really working: say so instead of showing "Listening..." forever.
    if(s&&!s.got&&(Date.now()-s.at)<1500){vFail++;}else{vFail=0;}
    if(vFail>=4){vGiveUp();return;}
    setTimeout(function(){if(listening&&!vRun)vBegin();},V_GAP_MS);
  };
  return r;
}
function vBegin(){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR||!listening||vRun)return;
  if(vMode==='B'||!recog){vDrop();recog=vMake();}
  var r=recog;
  r.lang=lang==='ko'?'ko-KR':'en-US';
  r.continuous=(vMode!=='C');
  var s={at:Date.now(),got:false,started:false,denied:false,wd:null,res:null,flush:null};
  if(vMode==='C'){vShort(s,r);}else{vLong(s,r);}
  vSess=s;
  try{r.start();vRun=true;vlog('start() called');}
  catch(ex){
    vlog('start() threw '+String((ex&&ex.name)||ex));vLastErr='start failed';
    vFail++;vDrop();
    if(vFail>=3){vGiveUp();return;}
    setTimeout(function(){if(listening&&!vRun)vBegin();},500);
    return;
  }
  // The phone sometimes accepts start() and then reports nothing at all. Do not wait for it forever:
  // after 4 seconds without any sign of life, try again with a new recognizer object.
  s.wd=setTimeout(function(){
    if(vSess!==s||s.started||!listening)return;
    vlog('no sign of life after start()');vLastErr='no start';
    vFail++;vDrop();
    if(vFail>=3){vGiveUp();return;}
    vBegin();
  },4000);
}
function startVoiceSession(){vBegin();} // name used by the describe helper

// Modes A and B: one long session. iOS delivers one cumulative transcript; this keeps count of the
// words already turned into items. (Logic unchanged from the build of 18 September 2026.)
function vLong(s,r){
  var committedWords=0;    // words of the transcript already turned into items
  var lastId=null,lastStart=0,lastCount=0,lastText='',lastDraftAt=0;
  var tm=null,pendingWords=null;
  var DRAFT_MS=400;        // stability window: item lands this long after you stop talking
  function fullTranscript(e){
    var parts=[];
    for(var i=0;i<e.results.length;i++){var t=e.results[i]&&e.results[i][0]?e.results[i][0].transcript:'';if(t)parts.push(t);}
    return parts.join(' ').replace(/\s+/g,' ').trim();
  }
  function commitTail(words){
    var tail=words.slice(committedWords).join(' ').trim();
    if(!tail)return;
    var id=commitVoice(tail);
    if(id){lastId=id;lastStart=committedWords;lastCount=words.length-committedWords;lastText=tail;lastDraftAt=Date.now();}
    committedWords=words.length;
    var mi=document.getElementById('mi');if(mi)mi.value='';
  }
  function reviseLast(words){
    // The recognizer may re-spell words it already gave us; apply that to the last item in place
    if(!lastId||lastCount<=0)return;
    var seg=words.slice(lastStart,lastStart+lastCount).join(' ').trim();
    if(!seg||seg.toLowerCase()===lastText.toLowerCase())return;
    var fixed=fixVoice(seg);
    for(var i=0;i<shop.length;i++){
      if(shop[i].id===lastId){shop[i].text=fixed;shop[i].category=classify(fixed);break;}
    }
    lastText=seg;sv();R();
  }
  s.res=function(e){
    var full=fullTranscript(e);
    var words=full?full.split(' '):[];
    if(words.length<committedWords){ // transcript was reset by the engine: start fresh bookkeeping
      committedWords=0;lastId=null;lastCount=0;lastText='';
    }
    reviseLast(words);
    var last=e.results[e.results.length-1];
    var isFinal=!!(last&&last.isFinal);
    var tail=words.slice(committedWords).join(' ');
    if(isFinal){
      var hadPending=(tm!==null);
      clearTimeout(tm);tm=null;
      if(hadPending&&tail){
        commitTail(words);                 // you were mid-way into a new item: it is its own item
      }else if(lastId&&(Date.now()-lastDraftAt)<3000&&words.length>lastStart){
        // Final re-spelling / re-splitting of the draft you just gave: correct it in place
        var seg=words.slice(lastStart).join(' ').trim();
        if(seg&&seg.toLowerCase()!==lastText.toLowerCase()){
          var fixed=fixVoice(seg);
          for(var i=0;i<shop.length;i++){if(shop[i].id===lastId){shop[i].text=fixed;shop[i].category=classify(fixed);break;}}
          lastText=seg;sv();R();
        }
        lastCount=words.length-lastStart;committedWords=words.length;
      }else{
        commitTail(words);
      }
    }else{
      var mi=document.getElementById('mi');if(mi)mi.value=tail;
      clearTimeout(tm);
      pendingWords=words;
      if(tail){tm=setTimeout(function(){tm=null;commitTail(words);},DRAFT_MS);}
    }
  };
  s.flush=function(){if(tm!==null){clearTimeout(tm);tm=null;if(pendingWords)commitTail(pendingWords);}};
}

// Mode C: one short session per item. The words become an item when the phone marks them final or
// when they have stopped changing; the session is then closed and its end opens the next one.
function vShort(s,r){
  var tm=null,draft='',done=false,text='',id=null;
  function commit(andStop){
    if(done||!draft)return;
    done=true;text=draft;
    id=commitVoice(draft);
    var mi=document.getElementById('mi');if(mi)mi.value='';
    if(andStop){try{r.stop();}catch(ex){}}
  }
  s.res=function(e){
    var parts=[];
    for(var i=0;i<e.results.length;i++){var t=e.results[i]&&e.results[i][0]?e.results[i][0].transcript:'';if(t)parts.push(t);}
    var tx=parts.join(' ').replace(/\s+/g,' ').trim();
    if(!tx)return;
    var last=e.results[e.results.length-1];
    var fin=!!(last&&last.isFinal);
    if(done){
      // Already added. A later version from the phone either re-spells the item (correct it in place)
      // or carries further words spoken before the session closed (they become their own item).
      var a=tx.toLowerCase(),b=text.toLowerCase();
      if(a===b)return;
      if(a.indexOf(b+' ')===0){
        if(!fin)return;
        var more=tx.slice(text.length).trim();
        text=tx;if(more)commitVoice(more);
        return;
      }
      if(id){
        var fixed=fixVoice(tx);
        for(var k=0;k<shop.length;k++){if(shop[k].id===id&&!shop[k].done){shop[k].text=fixed;shop[k].category=classify(fixed);break;}}
        text=tx;sv();R();
      }
      return;
    }
    draft=tx;
    var mi=document.getElementById('mi');if(mi)mi.value=tx;
    clearTimeout(tm);tm=null;
    if(fin){commit(true);}
    else{tm=setTimeout(function(){tm=null;commit(true);},V_STABLE_MS);}
  };
  s.flush=function(){if(tm!==null){clearTimeout(tm);tm=null;commit(false);}};
}

// The page can sit in the phone's cache for a while after an update. Ask the server (uncached) which
// build is current; if it is not this one, offer a one-tap update.
function checkBuild(){
  try{
    var x=new XMLHttpRequest();
    x.open('GET','version.json?t='+Date.now(),true);
    x.onload=function(){
      try{var j=JSON.parse(x.responseText);if(j&&j.build&&j.build!==BUILD)showUpdate(String(j.build));}catch(e){}
    };
    x.send();
  }catch(e){}
}
function showUpdate(b){
  if(document.getElementById('updbar'))return;
  var d=document.createElement('div');d.id='updbar';
  d.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:2500;background:#007AFF;color:#fff;font:600 14px -apple-system,sans-serif;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));text-align:center;cursor:pointer';
  d.textContent=lang==='ko'?'\uC0C8 \uBC84\uC804 \u2014 \uC5EC\uAE30\uB97C \uB20C\uB7EC \uC5C5\uB370\uC774\uD2B8':'New version available \u2014 tap here to update';

var VFIX={'breath':'bread','bred':'bread','brad':'bread','flower':'flour','meet':'meat','chilly':'chilli','pairs':'pears','pair':'pear','beats':'beets','leaks':'leeks','leak':'leek','time':'thyme','tuner':'tuna','sammon':'salmon','rise':'rice','yoga':'yogurt','paster':'pasta','mild':'milk','cheers':'cheese','aches':'eggs','been':'bean','gem':'jam','tee':'tea','coughing':'coffee','waiter':'water','whine':'wine','bear':'beer','lemmon':'lemon','union':'onion','karat':'carrot','carat':'carrot','salary':'celery','kail':'kale','hunny':'honey','serial':'cereal','ships':'chips','knots':'nuts','tomato\'s':'tomatoes','potato\'s':'potatoes','cellery':'celery','bagel\'s':'bagels','yoghurt':'yogurt','pepper\'s':'peppers','olive\'s':'olives','mushroom\'s':'mushrooms','avocado\'s':'avocados'};
var VFIXP=[['but her','butter'],['all live','olive'],['all lives','olives'],['orange use','orange juice'],['apple use','apple juice'],['to mate oh','tomato'],['dish washer','dishwasher'],['tooth paste','toothpaste']];
function fixVoice(tx){
  var t=' '+tx.toLowerCase().replace(/\s+/g,' ').trim()+' ';
  // phrase-level corrections first
  for(var i=0;i<VFIXP.length;i++){t=t.split(' '+VFIXP[i][0]+' ').join(' '+VFIXP[i][1]+' ');}
  // word-level corrections
  var words=t.trim().split(' ');
  for(var j=0;j<words.length;j++){if(VFIX.hasOwnProperty(words[j]))words[j]=VFIX[words[j]];}
  var out=words.join(' ');
  // keep the recognizer's capitalisation style: capitalise first letter
  return out.charAt(0).toUpperCase()+out.slice(1);
}
// ─── AI DESCRIBE (dormant until AI_URL/AI_TOKEN are set) ───
var AI_URL='__AI_URL__';
var AI_TOKEN='__AI_TOKEN__';
function aiOn(){return AI_URL.indexOf('__')!==0&&AI_URL.indexOf('http')===0;}
var aiArmed=false,aiBusy=false;
var lastVoiceItemId=null,lastVoiceItemAt=0;

function tapAI(){
  if(!aiOn())return;
  var mi=document.getElementById('mi');var typed=mi?mi.value.trim():'';
  if(typed){inp='';if(mi)mi.value='';resolveAI(typed);return;}
  aiArmed=!aiArmed;
  if(aiArmed){
    vmsg=lang==='ko'?'\uC5B4\uB5A4 \uBB3C\uAC74\uC778\uC9C0 \uC124\uBA85\uD574 \uC8FC\uC138\uC694...':'Describe the item...';
    if(!listening){listening=true;R();startVoiceSession();return;}
  }else{vmsg=listening?(lang==='ko'?'\uB4E3\uACE0 \uC788\uC2B5\uB2C8\uB2E4...':'Listening...'):null;}
  R();
}

function resolveAI(desc){
  if(!aiOn()||aiBusy)return;
  aiBusy=true;
  showToast(lang==='ko'?'\uC0DD\uAC01 \uC911...':'Thinking...');
  var hint='';
  if(lastVoiceItemId){for(var i=0;i<shop.length;i++){if(shop[i].id===lastVoiceItemId){hint=shop[i].text;break;}}}
  var cats=[];for(var k in CAT.en){if(k!=='Other')cats.push(k);}
  fetch(AI_URL,{method:'POST',headers:{'content-type':'application/json','x-app-token':AI_TOKEN},
    body:JSON.stringify({description:desc,lang:lang,heard:hint,categories:cats})})
  .then(function(r){return r.text();})
  .then(function(txt){
    aiBusy=false;
    var j=null;
    try{j=JSON.parse(txt.replace(/```json|```/g,'').trim());}catch(e){}
    if(!j||!j.name){showToast(lang==='ko'?'\uC54C \uC218 \uC5C6\uC74C':'Could not identify');R();return;}
    var name=String(j.name).trim();
    var cat=(j.category&&CAT.en[j.category])?j.category:classify(name);
    var replaced=null;
    if(lastVoiceItemId&&(Date.now()-lastVoiceItemAt)<90000){
      for(var i=0;i<shop.length;i++){
        if(shop[i].id===lastVoiceItemId&&!shop[i].done){replaced=shop[i].text;shop[i].text=name;shop[i].category=cat;break;}
      }
    }
    if(replaced===null){shop.push({id:nid(),text:name,category:cat,qty:1,photo:photo,done:false});photo=null;}
    lastVoiceItemId=null;
    sv();R();
    showToast(replaced!==null?(replaced+' \u2192 '+name):('\u2714 '+name));
  })
  .catch(function(){aiBusy=false;showToast(lang==='ko'?'AI \uC0AC\uC6A9 \uBD88\uAC00':'AI unavailable');R();});
}
var _lastVoiceText='',_lastVoiceAt=0;

function commitVoice(tx){
  if(aiArmed){aiArmed=false;vmsg=listening?(lang==='ko'?'\uB4E3\uACE0 \uC788\uC2B5\uB2C8\uB2E4...':'Listening...'):null;resolveAI(tx);return null;}
  tx=fixVoice(tx);
  var now=Date.now();
  if(tx.toLowerCase()===_lastVoiceText.toLowerCase()&&(now-_lastVoiceAt)<2500)return null;
  _lastVoiceText=tx;_lastVoiceAt=now;
  var c=classify(tx);
  var vid=nid();
  shop.push({id:vid,text:tx,category:c,qty:1,photo:photo,done:false});
  lastVoiceItemId=vid;lastVoiceItemAt=now;
  photo=null;var ph=document.getElementById('phIn');if(ph)ph.value='';
  inp='';
  vmsg='\u2714 '+tx;
  sv();R();
  return vid;
}

function showVM(m){vmsg=m;R();clearTimeout(vtm);vtm=setTimeout(function(){vmsg=null;R()},3500)}
function showToast(msg){
  var d=document.createElement('div');d.className='toast';d.textContent=msg;
  document.body.appendChild(d);setTimeout(function(){d.remove()},2500);
}

var undoTm=null;
function showUndo(item,type){
  var old=document.getElementById('undoToast');if(old)old.remove();
  clearTimeout(undoTm);
  var d=document.createElement('div');
  d.className='toast';d.id='undoToast';
  d.style.display='flex';d.style.alignItems='center';d.style.gap='12px';
  var label=document.createElement('span');
  if(type==='c'){
    label.textContent=(lang==='ko'?'\uC644\uB8CC: ':'Checked off: ')+item.text;
  }else{
    label.textContent=(lang==='ko'?'\uC0AD\uC81C\uB428: ':'Deleted: ')+item.text;
  }
  var btn=document.createElement('button');
  btn.textContent=lang==='ko'?'\uC2E4\uD589 \uCDE8\uC18C':'Undo';
  btn.style.cssText='background:#fff;color:#0062CC;border:none;padding:5px 14px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit';
  btn.onclick=function(){
    if(type==='c'){
      for(var i=0;i<shop.length;i++){if(shop[i].id===item.id){shop[i].done=false;break;}}
    }else{shop.push(item);}
    sv();R();d.remove();clearTimeout(undoTm);
  };
  d.appendChild(label);d.appendChild(btn);
  document.body.appendChild(d);
  undoTm=setTimeout(function(){d.remove()},3000);
}
