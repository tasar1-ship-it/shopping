*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;color:var(--text);min-height:100vh;overflow-x:hidden}
body{max-width:480px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom,20px)}
button{font-family:inherit}

.pp button{background:var(--fill);border:none;border-radius:7px;width:26px;height:26px;font-size:13px;cursor:pointer;color:var(--muted)}

.card{background:var(--card);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.card-n{font-size:14px;font-weight:600;color:var(--accent);margin:0 0 8px}
.card-p{font-size:13px;color:var(--text2);margin:0 0 10px;line-height:1.5}

var _P1=[],_P2=[];
(function(){
  for(var i=0;i<KR.length;i++){
    var kws=KR[i][1];
    for(var j=0;j<kws.length;j++){
      var kw=kws[j];
      var nonAscii=/[^\x00-\x7F]/.test(kw);
      if(kw.indexOf(' ')>-1||(nonAscii&&kw.length>=3)){_P1.push([kw,KR[i][0],nonAscii]);}
      else{_P2.push([kw,KR[i][0],nonAscii]);}
    }
  }
  _P1.sort(function(a,b){return b[0].length-a[0].length;});
})();
function _norm(t){
  return String(t).toLowerCase().replace(/[\u2019'`\u00B4]/g,"'").replace(/[.,;:!?()\[\]"]/g,' ').replace(/\s+/g,' ').trim();
}
function _hit(lower,e){
  var kw=e[0];
  if(e[2])return lower.indexOf(kw)>=0;
  if(!e[3]){
    var escaped=kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    // word boundary that also tolerates simple plurals: apple / apples / tomatoes
    e[3]=new RegExp('(^|[^a-z0-9])'+escaped+'(s|es)?($|[^a-z0-9])'); // built once per keyword, then reused
  }
  return e[3].test(lower);
}
// Whole-entry exceptions (a plural that would otherwise match an earlier section)
var _EX={'mints':'Sweets & Desserts','crema':'Personal Care','spread':'Chilled & Dairy','pur\u00E9':'Ready-Made & Convenience'};
function classify(text){
  var lower=_norm(text);
  if(!lower)return "Other";
  if(_EX.hasOwnProperty(lower))return _EX[lower];
  // "frozen ..." and "canned/tinned ..." decide the section whatever the food is
  // (pet food stays with Pet; "Eis" is German for ice cream and would otherwise match "Ei", egg)
  if(!/(^| )(dog|cat|pet|puppy|kitten)( |$)/.test(lower)){
    if(/(^| )(frozen|congelad[oa]s?|eis)( |$)/.test(lower))return "Frozen Foods";
    if(/(^| )(canned|tinned)( |$)/.test(lower))return "Canned & Preserved Goods";
  }
  for(var i=0;i<_P1.length;i++){if(_hit(lower,_P1[i]))return _P1[i][1];}
  for(var j=0;j<_P2.length;j++){if(_hit(lower,_P2[j]))return _P2[j][1];}
  return "Other";
}

function clean(arr){
  // Make any stored or restored list safe to use: real items only, each with its own numeric id
  var out=[],seen={},mx=uid,i;
  for(i=0;i<arr.length;i++){
    var it=arr[i];
    if(!it||typeof it!=='object'||!it.text)continue;
    it.text=String(it.text);it.done=!!it.done;
    if(!it.category)it.category='Other';
    if(!(it.qty>0))it.qty=1;
    if(typeof it.photo!=='string')it.photo=null;
    if(typeof it.id!=='number'||!(it.id>0)||seen[it.id]){it.id=0;}else{seen[it.id]=true;if(it.id>mx)mx=it.id;}

  return out;
}

function mergeBackup(d){
  if(canPush)return;
  syncFromPhone();
  if(d&&typeof d.length==='number'&&d.length){
    // restored items first; anything added on this phone in the meantime is kept after them
    var mine=shop;
    shop=clean(d);
    for(var i=0;i<shop.length;i++)shop[i].photo=null;
    fixUid();
    for(var j=0;j<mine.length;j++){mine[j].id=nid();shop.push(mine[j]);}
  }
  canPush=true;
  try{localStorage.removeItem('sl3_wait');}catch(e){}
  sv();R();
}

// ---- Lists sent from the other phone ----
var lastInboxTime=0;
function norm(s){return String(s).toLowerCase().replace(/\s+/g,' ').replace(/^ | $/g,'');}
function applyInbox(d){
  if(!d||!d.items||!d.items.length)return;
  if(d.time&&d.time===lastInboxTime)return; // the same delivery arriving twice
  if(d.time)lastInboxTime=d.time;
  syncFromPhone();
  // The sender always sends the whole list: skip what is already waiting on this list
  var have={};
  for(var h=0;h<shop.length;h++){if(!shop[h].done)have[norm(shop[h].text)]=true;}
  var count=0;
  for(var i=0;i<d.items.length;i++){
    var it=d.items[i];
    if(!it||!it.text)continue;
    if(have[norm(it.text)])continue;
    shop.push({id:nid(),text:String(it.text),category:it.category||classify(it.text),qty:it.qty||1,photo:null,done:false});
    count++;
  }
  if(fbUp){try{db.ref('inbox/'+devId).remove();}catch(e){}}
  if(count>0){tab='shopping';sv();R();toast(count+(count===1?' item received':' items received'));}
  else{toast('Nothing new received');}
}
function listenInbox(){
  if(!fbUp)return;
  try{
    db.ref('inbox/'+devId).on('value',function(snap){
      var d=snap.val();
      if(!d)return;
      applyInbox(d);
    });
    db.ref('.info/connected').on('value',function(snap){online=snap.val()===true;renderHead();});
  }catch(e){}
}
function getTarget(){try{return localStorage.getItem('sl3_target')||'';}catch(e){return '';}}
function setupSend(){
  closeSend();
  var d=document.createElement('div');d.className='sheet';d.id='sendOv';
  d.innerHTML='<div class="sheet-hd"><div class="sheet-ti">Send to R</div><button class="sheet-x" onclick="closeSend()" aria-label="Close">&times;</button></div>'
  +'<div class="sheet-body">'
  +'<div class="card"><div class="card-n">Your ID</div><div class="bigid">'+esc(devId)+'</div>'
  +'<div class="card-p" style="margin:0">Give this ID to the person who should be able to send you their list.</div></div>'
  +'<div class="card"><div class="card-n">Receiver\'s ID</div>'
  +'<div class="card-p">Enter the ID shown on the phone that should receive your list.</div>'
  +'<input type="text" class="idin" id="targetInput" value="'+esc(getTarget())+'" placeholder="ABC123" autocomplete="off" autocapitalize="characters" maxlength="6">'
  +'<button class="stb" style="width:100%;justify-content:center" onclick="saveTarget()">Save</button>'

function closeSend(){gone(document.getElementById('sendOv'));}
function saveTarget(){
  var i=document.getElementById('targetInput');if(!i)return;
  var t=String(i.value).replace(/\s+/g,'').toUpperCase();
  if(t===devId){toast('That is this phone\'s own ID');return;}
  try{if(t){localStorage.setItem('sl3_target',t);}else{localStorage.removeItem('sl3_target');}}catch(e){}
  closeSend();R();toast(t?'Saved':'Receiver removed');
}
function sendToR(){
  syncFromPhone();
  var target=getTarget();
  if(!target){setupSend();return;}
  if(!fbUp||!online){toast('No connection - cannot send right now');return;}
  var out=[];
  for(var i=0;i<shop.length;i++){if(!shop[i].done)out.push({text:shop[i].text,category:shop[i].category,qty:shop[i].qty||1});}
  if(!out.length)return;
  try{
    db.ref('inbox/'+target).set({items:out,from:devId,time:Date.now()},function(err){
      toast(err?'Sending failed':(out.length+(out.length===1?' item sent':' items sent')));
    });
  }catch(e){toast('Sending failed');}
}

function setHTML(id,h){var el=document.getElementById(id);if(el)el.innerHTML=h;}
function split(){
  // active = still to buy (an item stays visible while its tick animation runs)
  var o={act:[],luk:[],dn:[]};
  for(var i=0;i<shop.length;i++){
    var it=shop[i];
    if(it.done&&!anim[it.id])o.dn.push(it);
    else if(it.category==='Lukas')o.luk.push(it);
    else o.act.push(it);
  }
  return o;
}
function groups(items){
  var g={},keys=[],i;
  for(i=0;i<items.length;i++){var c=items[i].category||'Other';if(!g[c]){g[c]=[];keys.push(c);}g[c].push(items[i]);}
  keys.sort(function(a,b){var ra=a==='Other'?1:0,rb=b==='Other'?1:0;if(ra!==rb)return ra-rb;return a<b?-1:(a>b?1:0);});
  var out=[];for(i=0;i<keys.length;i++)out.push({c:keys[i],items:g[keys[i]]});
  return out;
}

  var keep=[];for(var i=0;i<shop.length;i++){if(shop[i].id!==id)keep.push(shop[i]);}
  shop=keep;sv();R();
  showUndo('Deleted: '+it.text,function(){shop.push(it);sv();R();});

function clearShop(){
  syncFromPhone();
  var removed=[],keep=[];
  for(var i=0;i<shop.length;i++){if(shop[i].done||shop[i].category==='Lukas')keep.push(shop[i]);else removed.push(shop[i]);}
  if(!removed.length)return;
  if(!window.confirm('Clear all '+removed.length+(removed.length===1?' item?':' items?')))return;
  shop=keep;sv();R();
  showUndo('Cleared '+removed.length+(removed.length===1?' item':' items'),function(){shop=shop.concat(removed);sv();R();});
}
function delAllDone(){
  syncFromPhone();

  for(var i=0;i<shop.length;i++){if(shop[i].done)removed.push(shop[i]);else keep.push(shop[i]);}

  shop=keep;sv();R();
  showUndo('Deleted '+removed.length+(removed.length===1?' item':' items'),function(){shop=shop.concat(removed);sv();R();});

function phPicked(input){
  var f=input.files&&input.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(e){
    shrink(e.target.result,function(small){
      photo=small;
      var mi=document.getElementById('mi');
      if(mi&&String(mi.value).replace(/\s+/g,'')){addS();} // a name is already typed: add it with the photo
      else{R();}
    });
  };
  r.readAsDataURL(f);
}
function shrink(dataURL,cb){
  var img=new Image();
  img.onload=function(){
    var mx=400,w=img.width,h=img.height;
    if(w>mx||h>mx){if(w>h){h=Math.round(h*mx/w);w=mx;}else{w=Math.round(w*mx/h);h=mx;}}
    try{
      var c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      cb(c.toDataURL('image/jpeg',0.6));
    }catch(e){cb(dataURL);}
  };
  img.onerror=function(){cb(dataURL);};
  img.src=dataURL;
}
function showPh(id,ev){
  if(ev&&ev.stopPropagation)ev.stopPropagation();
  var it=find(id);if(!it||!it.photo)return;
  var d=document.createElement('div');d.className='overlay';d.id='phOv';
  d.onclick=function(){gone(d);};
  var im=document.createElement('img');im.src=it.photo;im.alt='';d.appendChild(im);
  document.body.appendChild(d);
}

// ---- Voice ----
// What the phone's own logs showed on 12 November 2026 (Safari 27.2), over 14 microphone sessions:
//  - The first session on a page always works. It reports "started" 200 ms or more after start().
//  - A session opened after an earlier one has ended is often deaf: it reports "started" within 40 ms and
//    then hears nothing. This happened 2, 2.4, 6.9, 10 and 15 seconds after the earlier session ended, while
//    6, 10 and 34 seconds worked - so no waiting time makes re-opening safe.
// Therefore:
//  (1) Tapping the microphone while it listens does not close the session. It PAUSES: the session stays
//      open, what it hears is ignored, and a tap continues at once with nothing to re-open. The pause is
//      shown on screen, ends by itself after V_PAUSE_MS, and can be ended at once by tapping the message.
//  (2) When a session really has to be re-opened, a "started" report faster than V_FAST_START is treated as
//      the deaf case: the app says so, waits, and tries again with a new recognizer - it never shows
//      "Listening..." for a session it has reason to believe is deaf.
//  (3) Every tap and event (no words) is logged to diag/<phone ID>, so the next change rests on evidence.
var V_MIN_GAP=6000;       // shortest pause between the end of one session and the start of the next
var V_FAST_START=120;     // a "started" report sooner than this (not on the page's first session) = deaf
var V_RETRY_WAITS=[20000,30000]; // pauses before trying again after a deaf start
var V_PAUSE_MS=60000;     // how long a paused session is kept open
var listening=false,recog=null,vmsg='';
var vPaused=false,vPauseTm=null;
var vRun=false;           // start() was called and that session has not reported its end
var vSess=null,vSessions=0,vFail=0,vRetry=0,vHeld=false,vInTap=false,vLastErr='',vNotBefore=0,vEndedAt=0,vTimer=null,vtm=null;
var vLog=[],vLogId=0,vT0=Date.now();
function vlog(s){if(vLog.length<300)vLog.push((Date.now()-vT0)+' '+s);}
function vFlush(){
  if(!fbUp||!vLogId||!vLog.length)return;
  var ua='';try{ua=String(navigator.userAgent||'').slice(0,160);}catch(e){}
  try{db.ref('diag/'+devId+'/'+vLogId).set({build:BUILD,ua:ua,log:vLog});}catch(e){}
}
function vBtn(){var b=document.getElementById('micBtn');if(b)b.className='ib'+(listening?' ma':(vPaused?' pa':''));}
function vShow(msg,dot){
  vmsg=msg||'';
  setHTML('vs',msg?'<div class="vt">'+(dot?'<span class="vd"></span>':'')+esc(msg)+'</div>':'');
  vBtn();
}
function showVM(m){vShow(m,false);clearTimeout(vtm);vtm=setTimeout(function(){if(vmsg===m)vShow('',false);},4000);}
function tgV(){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){showVM('Voice input is not available in this browser');return;}
  if(listening){vPause();return;}
  if(vPaused){vResume();return;}
  listening=true;vFail=0;vRetry=0;vHeld=false;vLastErr='';
  vLogId=Date.now();vLog=[];vT0=Date.now();vlog('tap on, build '+BUILD);
  setTimeout(vFlush,8000); // save the log even if the microphone is never switched off
  vInTap=true;vArm();vInTap=false;
}
function vPause(){
  // Nothing worth keeping open (still starting or counting down): switch off properly
  if(!(vRun&&recog&&vSess&&vSess.alive)){vOff();return;}
  listening=false;vPaused=true;vlog('pause');
  if(vSess.flush)vSess.flush(); // words already heard become their item
  clearTimeout(vPauseTm);
  vPauseTm=setTimeout(function(){if(vPaused){vlog('pause ran out');vOff();}},V_PAUSE_MS);
  vmsg='Paused';
  setHTML('vs','<div class="vt" onclick="vOff()">Paused - tap the microphone to continue. It stays connected for '+Math.round(V_PAUSE_MS/1000)+' s; tap here to switch it off now.</div>');
  vBtn();
  setTimeout(vFlush,1500);
}
function vResume(){
  clearTimeout(vPauseTm);vPauseTm=null;vPaused=false;
  if(!(vRun&&recog)){tgV();return;} // the session is gone after all: open one the normal way
  listening=true;vlog('resume');
  vShow('Listening...',true);
}
function vOff(){
  listening=false;vPaused=false;clearTimeout(vPauseTm);vPauseTm=null;vlog('off');
  clearTimeout(vTimer);vTimer=null;
  if(vSess)clearTimeout(vSess.wd);
  // stop(), not abort(): the phone finishes the words it has already heard
  if(vRun&&recog){try{recog.stop();}catch(ex){}}
  vShow('',false);
  setTimeout(vFlush,1500);
}
function vArm(){
  // Open a session now, or count down to the moment one may be opened
  clearTimeout(vTimer);vTimer=null;
  if(!listening)return;
  if(vRun){
    // the previous session is still closing; its end calls vArm again. Do not wait for ever.
    vShow('Starting microphone...',false);
    var w=vSess;
    vTimer=setTimeout(function(){
      if(listening&&vRun&&vSess===w){vlog('old session never ended');vDrop();vNotBefore=Date.now()+V_MIN_GAP;vArm();}
    },2000);
    return;
  }
  var wait=vNotBefore-Date.now();
  if(wait>0){
    var secs=Math.ceil(wait/1000);
    vShow(vHeld?('The iPhone is still holding the microphone - trying again in '+secs+' s'):('Microphone ready in '+secs+' s'),false);
    vTimer=setTimeout(vArm,wait>1000?1000:wait);
    return;
  }

}
function vGiveUp(){
  listening=false;vPaused=false;vlog('gave up: '+vLastErr);
  // stays on screen until the next tap
  vShow('Voice stopped'+(vLastErr?' ('+vLastErr+')':'')+'. Try the microphone again in a minute, or use the microphone key on the keyboard.',false);
  vFlush();
}
function vDrop(){
  // Forget the recognizer completely; the next session gets a new one
  var o=recog;recog=null;vRun=false;vEndedAt=Date.now();
  if(o){o.onstart=o.onresult=o.onerror=o.onend=null;try{o.abort();}catch(ex){}}
}
function vMake(){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  var r=new SR();
  r.lang='en-US';r.continuous=true;r.interimResults=true;r.maxAlternatives=1;
  function note(name){r['on'+name]=function(){if(r!==recog)return;if(vSess)vSess.alive=true;vlog(name);};}
  note('audiostart');note('soundstart');note('speechstart');note('speechend');note('soundend');note('audioend');note('nomatch');
  r.onstart=function(){
    if(r!==recog||!vSess)return;

      // the deaf case: never show "Listening..." for it
      vlog('deaf start (too fast), attempt '+(vRetry+1));
      clearTimeout(s.wd);vDrop();
      if(!listening){vPaused=false;clearTimeout(vPauseTm);vPauseTm=null;vShow('',false);return;}
      if(vRetry>=V_RETRY_WAITS.length){vLastErr='the iPhone is not releasing the microphone';vGiveUp();return;}
      vHeld=true;vNotBefore=Date.now()+V_RETRY_WAITS[vRetry];vRetry++;
      vArm();
      return;
    }
    vHeld=false;
    if(listening)vShow('Listening...',true);
  };
  r.onresult=function(e){
    if(r!==recog||!vSess)return;
    vSess.alive=true;
    if(vPaused){vSess.skip(e);return;} // paused: what is heard now is ignored for good
    vSess.got=true;vFail=0;vRetry=0;
    var last=e.results[e.results.length-1];
    vlog('result '+(last&&last.isFinal?'final':'draft')+' n'+e.results.length);
    vSess.res(e);
  };
  r.onerror=function(e){
    if(r!==recog)return;
    vLastErr=(e&&e.error)||'';vlog('error '+vLastErr);
    if(vLastErr==='not-allowed'||vLastErr==='service-not-allowed'){
      listening=false;vPaused=false;clearTimeout(vPauseTm);vPauseTm=null;if(vSess)vSess.denied=true;
      showVM('The microphone is not allowed for this page');
    }
  };
  r.onend=function(){
    if(r!==recog)return;
    vlog('end');vRun=false;vEndedAt=Date.now();vNotBefore=vEndedAt+V_MIN_GAP;
    if(vPaused){vPaused=false;clearTimeout(vPauseTm);vPauseTm=null;vlog('ended while paused');}
    var s=vSess;
    if(s){clearTimeout(s.wd);s.flush();} // words heard but not yet turned into an item are kept
    if(!listening){

      else{vBtn();}
      vFlush();return;
    }

    // microphone is not really working: say so instead of pretending to listen.
    if(s&&!s.got&&(Date.now()-s.at)<1500){vFail++;}else{vFail=0;}

    vArm();
  };

}
function vBegin(){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR||!listening||vRun)return;
  if(!recog)recog=vMake();

  vWords(s);
  vSess=s;vSessions++;
  try{
    r.start();vRun=true;
    vlog('start() called, session '+vSessions+', '+(vEndedAt?(Math.round((Date.now()-vEndedAt)/100)/10)+' s after the last one ended':'first on this page')+', from a '+(vInTap?'tap':'timer'));
  }
  catch(ex){
    vlog('start() threw '+String((ex&&ex.name)||ex));vLastErr='could not start';
    vFail++;vDrop();vNotBefore=Date.now()+V_MIN_GAP;
    if(vFail>=3){vGiveUp();return;}
    vArm();

  }

// Turning what the phone hears into items.
// The phone's log of 12 November 2026 shows how it reports speech: in separate entries, one per stretch of
// speech; the words of an entry arrive as drafts up to about half a second apart, and its final wording
// follows 2 to 3 seconds after you stop. So: words become an item when they have not changed for
// V_DRAFT_MS (long enough that "paper ... towels" stays one item), and when the final wording of an entry
// arrives it replaces the draft wording of the item instead of adding anything.
var V_DRAFT_MS=1200;
function vWords(s){
  var ent=[];            // per entry: {n: words already turned into items, items: [{id,count}], closed}
  var tm=null,pend=null; // a draft waiting to become an item: {i: entry, words}
  function wordsOf(r){
    var t=r&&r[0]?String(r[0].transcript||''):'';
    t=t.replace(/\s+/g,' ').replace(/^ | $/g,'');
    return t?t.split(' '):[];
  }
  function box(v){var mi=document.getElementById('mi');if(mi)mi.value=v;}
  function retext(id,seg){
    var it=id?find(id):null;
    if(!it||it.done||!seg)return;
    var fixed=fixVoice(seg);
    if(it.text===fixed)return;
    it.text=fixed;if(it.category!=='Lukas')it.category=classify(fixed);
    if(id===lastVoiceId)lastVoiceText=fixed;
    sv();R();
  }
  function commit(i,words){
    var en=ent[i],tail=words.slice(en.n).join(' ');
    if(!tail)return;
    var id=commitVoice(tail);
    en.items.push({id:id,from:en.n,count:words.length-en.n,text:tail}); // the item is words [from, from+count) of its entry
    en.n=words.length;
    box('');
  }
  function finalize(i,words){
    var en=ent[i],k;
    if(!words.length)return;
    // items made before a pause are settled; only the ones made since may still be corrected
    var live=en.items.slice(en.frozen||0);
    if(live.length===0){commit(i,words);return;} // (words passed over during a pause stay passed over)
    var lastIt=live[live.length-1],end=lastIt.from+lastIt.count;
    if(live.length===1){
      // one item came from this stretch, perhaps from an early draft: the final wording replaces it
      var fin=words.slice(lastIt.from).join(' ');
      if(!fin)return;
      if(!lastIt.id&&fin.toLowerCase()!==String(lastIt.text).toLowerCase()){
        // the draft was skipped as a repeat of the item before it, but the final wording says more
        lastIt.id=commitVoice(fin);lastIt.text=fin;
      }
      retext(lastIt.id,fin);
      lastIt.count=words.length-lastIt.from;en.n=words.length;
      return;
    }
    // you paused in speaking, so this stretch became several items
    if(words.length===end){
      for(k=0;k<live.length;k++){retext(live[k].id,words.slice(live[k].from,live[k].from+live[k].count).join(' '));}
    }else if(words.length>end){
      // more words than the drafts had: they finish the last item
      retext(lastIt.id,words.slice(lastIt.from).join(' '));
      lastIt.count=words.length-lastIt.from;en.n=words.length;
    }
    // fewer words than were already turned into items: leave the items as they are
  }
  s.res=function(e){
    for(var i=0;i<e.results.length;i++){
      if(!ent[i])ent[i]={n:0,items:[],closed:false};
      var en=ent[i];
      if(en.closed)continue;
      var r=e.results[i],words=wordsOf(r);
      if(r&&r.isFinal){
        if(pend&&pend.i===i){clearTimeout(tm);tm=null;pend=null;}
        vlog('entry '+(i+1)+' final, '+words.length+' words, '+en.items.length+' items so far');
        finalize(i,words);
        en.closed=true;
        if(i===e.results.length-1)box('');
      }else{
        if(words.length<en.n)continue; // the phone shortened what it gave: wait for its final wording
        var tail=words.slice(en.n).join(' ');
        if(i===e.results.length-1)box(tail);
        if(tail){
          // a draft still waiting from an earlier entry becomes its item now
          if(pend&&pend.i!==i){clearTimeout(tm);tm=null;var q=pend;pend=null;commit(q.i,q.words);}
          clearTimeout(tm);
          pend={i:i,words:words};
          tm=setTimeout(function(){tm=null;var p=pend;pend=null;if(p)commit(p.i,p.words);},V_DRAFT_MS);
        }
      }
    }
  };
  s.flush=function(){if(tm!==null){clearTimeout(tm);tm=null;}var p=pend;pend=null;if(p)commit(p.i,p.words);};
  s.skip=function(e){
    // heard while paused: finished entries are closed, and the words so far of an open entry are passed over
    for(var i=0;i<e.results.length;i++){
      if(!ent[i])ent[i]={n:0,items:[],closed:false};
      var r=e.results[i];
      var en=ent[i];
      if(en.closed)continue;
      var words=wordsOf(r);
      if(r&&r.isFinal){
        // a final wording with no new words only corrects what was said before the pause
        if(!en.passed&&words.length===en.n)finalize(i,words);
        en.closed=true;
      }else{
        if(words.length>en.n){en.n=words.length;en.passed=true;}
        en.frozen=en.items.length; // what was made before the pause is settled from here on
      }
    }
  };
}
// Words the phone often mishears for groceries
var VFIX={'breath':'bread','bred':'bread','brad':'bread','flower':'flour','meet':'meat','chilly':'chilli','pairs':'pears','pair':'pear','beats':'beets','leaks':'leeks','leak':'leek','time':'thyme','tuner':'tuna','sammon':'salmon','rise':'rice','yoga':'yogurt','paster':'pasta','mild':'milk','cheers':'cheese','aches':'eggs','been':'bean','gem':'jam','tee':'tea','coughing':'coffee','waiter':'water','whine':'wine','bear':'beer','lemmon':'lemon','union':'onion','karat':'carrot','carat':'carrot','salary':'celery','kail':'kale','hunny':'honey','serial':'cereal','ships':'chips','knots':'nuts','tomato\'s':'tomatoes','potato\'s':'potatoes','cellery':'celery','bagel\'s':'bagels','yoghurt':'yogurt','pepper\'s':'peppers','olive\'s':'olives','mushroom\'s':'mushrooms','avocado\'s':'avocados'};
var VFIXP=[['but her','butter'],['all live','olive'],['all lives','olives'],['orange use','orange juice'],['apple use','apple juice'],['to mate oh','tomato'],['dish washer','dishwasher'],['tooth paste','toothpaste']];
function fixVoice(tx){
  var t=' '+String(tx).toLowerCase().replace(/\s+/g,' ').replace(/^ | $/g,'')+' ';
  for(var i=0;i<VFIXP.length;i++){t=t.split(' '+VFIXP[i][0]+' ').join(' '+VFIXP[i][1]+' ');}
  var words=t.replace(/^ | $/g,'').split(' ');
  for(var j=0;j<words.length;j++){if(VFIX.hasOwnProperty(words[j]))words[j]=VFIX[words[j]];}
  var out=words.join(' ');
  return out.charAt(0).toUpperCase()+out.slice(1);
}
var lastVoiceText='',lastVoiceAt=0,lastVoiceId=null;
function commitVoice(tx){
  tx=fixVoice(tx);
  var now=Date.now();
  if(tx.toLowerCase()===lastVoiceText.toLowerCase()&&(now-lastVoiceAt)<2500)return null; // the same words delivered twice
  lastVoiceText=tx;lastVoiceAt=now;
  var it=addItem(tx,null,true);
  lastVoiceId=it.id;
  vlog('item');
  return it.id;
}
// iPhone Safari kills the microphone when the page goes to the background: show it as off
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState!=='visible'&&(listening||vPaused)){vlog('page hidden');vOff();}
});

// ---- Is there a newer version? ----
// The page can sit in the phone's cache after an update. Ask the server (uncached) which build is
// current; if it is not this one, offer a one-tap update.
function checkBuild(){
  try{
    var x=new XMLHttpRequest();
    x.open('GET','version.json?t='+Date.now(),true);
    x.onload=function(){
      try{var j=JSON.parse(x.responseText);if(j&&j.build&&j.build!==BUILD)showUpdate(String(j.build));}catch(e){}
    };
    x.send();
  }catch(e){}
}
function showUpdate(b){
  if(document.getElementById('updbar'))return;
  var d=document.createElement('div');d.id='updbar';d.className='bar';
  d.textContent='New version available - tap here to update';
  d.onclick=function(){try{location.replace(location.pathname+'?b='+encodeURIComponent(b));}catch(e){}};
  document.body.appendChild(d);
}
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')checkBuild();});

ld();
listenInbox();
R();
